# ============================================================================
# 站点配置 / Site configuration
# 规则 / Rules:
#   - 语言无关的东西 (favicon/avatar/链接/features/i18n/navigation 骨架) 只写一次
#   - 需要多语言的文案写成 localized value: { en = "...", zh = "..." }
#   - 新增一门语言 = 给每个 localized value 多加一个 key, 不要复制任何结构
# ============================================================================

[site]
title = { en = "Qi Xiong", zh = "熊旗" }
description = { en = "Personal website of Qi Xiong, researching end-to-end autonomous driving, robotics, and computer vision.", zh = "熊旗的个人主页" }
favicon = "/assets/site/favicon.jpg"
last_updated = { en = "August 12, 2026", zh = "2026年08月12日" }

[author]
name = { en = "Qi Xiong", zh = "熊旗" }
title = { en = "Master's student", zh = "硕士研究生" }
institution = { en = "Xidian University", zh = "西安电子科技大学" }
avatar = "/assets/site/avatar.png"

# 额外身份, 显示在 institution 下方; 一行一个, 以后再加身份直接往数组里追, 不用改代码
[author.affiliations]
en = ["Intern, D-Robotics"]
zh = ["地瓜机器人实习生"]

[social]
# Contact information (leave blank or delete to hide)
email = "xiongqi@stu.csust.edu.cn"
location = { en = "Xi'an, China", zh = "西安，中国" }
location_url = "https://maps.google.com"
google_scholar = "https://scholar.google.com/citations?user=alkeilYAAAAJ&hl=zh-CN"
orcid = "https://orcid.org/0009-0000-1212-9053"
github = "https://github.com/xiongqi123123"

[social.location_details]
en = ["Xidian University,", "Xi'an, China"]
zh = ["主楼 312 室，", "西安电子科技大学，西安，中国"]

[features]
# Show a like button on the about page
enable_likes = true
# Display all subpages on a single page
enable_one_page_mode = false

[i18n]
enabled = true
locales = ["zh", "en"]
default_locale = "en"
# "auto" = 跟随浏览器语言; "fixed" = 固定为 fixed_locale
mode = "auto"
fixed_locale = "en"
# If true, PRISM will remember user's language preference in browser's localStorage
persist = true
# Show a language switcher on the top right corner
switcher = true

[i18n.labels]
zh = "中文"
en = "English"

# ---------------------------------------------------------------------------
# 导航 / 页面注册表 (Navigation & page registry)
#   target = content/<target>/ 目录名 = 路由 slug = one-page 模式的 DOM id
#   target / type / href 是语言无关结构, 只写一次; 只有 title 是多语言
#   ★ target 与 href 已冻结, 任何情况下不得修改
# ---------------------------------------------------------------------------
[[navigation]]
type = "page"
target = "about"
href = "/"
title = { en = "About", zh = "关于我" }

[[navigation]]
type = "page"
target = "publications"
href = "/publications"
title = { en = "Publications", zh = "论文" }

[[navigation]]
type = "page"
target = "awards"
href = "/awards"
title = { en = "Awards", zh = "奖项" }

[[navigation]]
type = "page"
target = "services"
href = "/services"
title = { en = "Services", zh = "服务" }

[[navigation]]
type = "page"
target = "projects"
href = "/projects"
title = { en = "Open Source", zh = "开源项目" }

[[navigation]]
type = "page"
target = "cv"
href = "/cv"
title = { en = "CV", zh = "简历" }
